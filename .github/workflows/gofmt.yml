name: Format Go

# Auto-format Go files on every PR. If `gofmt` produces a change, this job
# commits and pushes the diff to the PR branch so the developer doesn't have
# to redo it locally. Uses a PAT so the push triggers the main CI workflow
# (the default GITHUB_TOKEN's pushes do not).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: gofmt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.3"

jobs:
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    # PRs from forks can't be pushed to with our token; skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go fmt
        run: go fmt ./...

      - name: Commit and push if formatted
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "Michael Duren"
          git config user.email "michaeld@michaelduren.com"
          git add -A
          git commit -m "style: gofmt"
          git push
