name: gopls

# Run gopls diagnostics on every push and pull request. Any finding —
# hint, info, warning, or error — fails the job. The Makefile target
# `make gopls` runs the same command locally.
on:
  push:
  pull_request:

concurrency:
  group: gopls-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.3"
  # Pinned so the CI diagnostic set matches the version contributors install
  # locally. Bump together with the Go toolchain when the time comes.
  GOPLS_VERSION: "v0.22.0"

jobs:
  gopls:
    name: gopls check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gopls
        run: go install golang.org/x/tools/gopls@${{ env.GOPLS_VERSION }}

      - name: Run gopls check
        run: make gopls
