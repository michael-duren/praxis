name: Release

# Triggered by pushing a tag matching v*. GitHub Actions tag pushes carry no
# branch context, so the tag pattern alone is the gate — adding a branches
# filter would silently skip every run.
on:
  push:
    tags:
      - "v*"

# The release job needs write access to create the GitHub Release and upload
# artifacts; everything else stays read-only.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned to the version declared in go.mod and the other workflows.
  GO_VERSION: "1.26.3"

jobs:
  # Gate the release on the same checks CI runs. `make release` runs these
  # locally before pushing the tag, but the tag is what ships — verify it.
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Compute build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "binary=praxis-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }} -X main.commit=${{ steps.meta.outputs.commit }} -X main.date=${{ steps.meta.outputs.date }}" \
            -o "dist/${{ steps.meta.outputs.binary }}" \
            ./cmd/praxis

      - name: Sanity-check binary (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          out=$("./dist/${{ steps.meta.outputs.binary }}" version)
          echo "$out"
          echo "$out" | grep -q "praxis ${{ steps.meta.outputs.version }}"
          echo "$out" | grep -q "commit:  ${{ steps.meta.outputs.commit }}"
          echo "$out" | grep -q "built:   ${{ steps.meta.outputs.date }}"

      - name: Generate SHA-256 checksum
        run: |
          cd dist
          sha256sum "${{ steps.meta.outputs.binary }}" > "${{ steps.meta.outputs.binary }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: praxis-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/${{ steps.meta.outputs.binary }}
            dist/${{ steps.meta.outputs.binary }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: praxis-*
          merge-multiple: true
          path: dist

      - name: Assemble combined SHA256SUMS
        run: |
          cd dist
          # Concatenate every per-binary checksum into one canonical file.
          # Each .sha256 already follows `sha256sum`'s `<hash>  <filename>` format.
          : > SHA256SUMS
          for f in *.sha256; do
            cat "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
